<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>夜铃 · 打给AI</title>
<style>
/*~ 夜铃 · 主题 */
:root{
  --bg1:#f6f6f8; --bg2:#f1f1f3; --bg3:#eaeaea;
  --ink:#2c2c31; --ink-strong:#0f0f12; --ink-soft:#55555e; --ink-faint:rgba(44,44,49,.56);
  --p1:#141418; --p2:#2b2b33; --p3:#4c4c58;
  --p-soft:#e8e8ec; --p-bg:#f0f0f3;
  --accent1:#141418; --accent2:#2b2b33;
  --card:rgba(255,255,255,.72); --card-glass:rgba(255,255,255,.5); --card-solid:#fff; --card-strong:#fff; --card-input:#f2f2f5;
  --border:rgba(20,20,26,.16);
  --shadow:rgba(20,20,26,.07); --shadow-strong:rgba(20,20,26,.16); --shadow-deep:rgba(20,20,26,.2);
  --glow:rgba(20,20,26,.06);
}
body[data-mode="dark"]{
  --bg1:#0f0f11; --bg2:#141417; --bg3:#18181c;
  --ink:#a9a9b4; --ink-strong:#f0f0f4; --ink-soft:#8b8b96; --ink-faint:rgba(169,169,180,.52);
  --p1:#f0f0f4; --p2:#c9c9d2; --p3:#8b8b96;
  --p-soft:#232329; --p-bg:#282830;
  --accent1:#f0f0f4; --accent2:#d0d0d8;
  --card:rgba(255,255,255,.05); --card-glass:rgba(255,255,255,.07); --card-solid:#1b1b20; --card-strong:#222229; --card-input:#1d1d23;
  --border:rgba(255,255,255,.16);
  --shadow:rgba(0,0,0,.3); --shadow-strong:rgba(0,0,0,.45); --shadow-deep:rgba(0,0,0,.55);
  --glow:rgba(255,255,255,.05);
}
body.custom-bg{ background: var(--customBg, none) center/cover no-repeat fixed !important; }
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
  font-family:-apple-system,"PingFang SC","HarmonyOS Sans",sans-serif;
  background:var(--bg1);
  height:100vh; height:100dvh; display:flex; justify-content:center; align-items:center;
  color:var(--ink); overflow:hidden; user-select:none; transition:background .4s;
}
.phone{ width:min(420px,100vw); height:100dvh; position:relative; z-index:1; }
.screen{ position:absolute; inset:0; display:flex; flex-direction:column; transition:opacity .35s,transform .35s; }
.screen.hidden{ opacity:0; pointer-events:none; transform:translateY(10px); }

/*~ 拨号页 */
#dial{ padding:16px 22px 18px; gap:8px; }
.dial-top{ display:flex; align-items:center; justify-content:space-between; }
.dial-top::before{ content:"NIGHT BELL"; font-size:9px; font-weight:600; letter-spacing:6px; color:var(--ink-soft); }
.gear{ width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:9px; background:transparent; border:1px solid var(--border); color:var(--ink-soft); cursor:pointer; }
.gear svg{ width:16px; height:16px; }

/*~ 通话记录 · 横向卡片 */
.calls-panel{ display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch; gap:8px; overflow-y:auto; overflow-x:hidden; height:auto; max-height:none; flex:1 1 auto; min-height:0; padding:2px 0; scrollbar-width:none; }
.calls-panel::-webkit-scrollbar{ display:none; }
.calls-empty{ width:100%; display:flex; align-items:center; justify-content:center; font-size:10px; letter-spacing:3px; color:var(--ink-faint); }
.call-item{ flex:0 0 auto; align-self:stretch; max-height:66px; min-width:0; max-width:100%; width:100%; overflow:hidden; display:flex; align-items:center; gap:8px; height:66px; padding:0 16px; border:1px solid var(--border); border-radius:14px; background:var(--card); cursor:pointer; }
.call-item:active{ opacity:.5; }
.call-item .ci-main{ flex:1 1 auto; min-width:0; overflow:hidden; }
.call-item .ci-name{ font-size:15px; font-weight:500; color:var(--ink-strong); letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.call-item .ci-sub{ font-size:11px; color:var(--ink-soft); margin-top:4px; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.call-item .ci-date{ display:none; }
.call-item .ci-del{ margin-left:auto; width:26px; height:26px; border:none; background:transparent; color:var(--ink-soft); font-size:16px; line-height:1; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
#dial.kp-collapsed .calls-panel{ flex-direction:column; height:auto; max-height:none; flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:0; }
#dial.kp-collapsed .call-item{ height:60px; max-height:60px; width:100%; border-radius:12px; }
#dial.kp-collapsed .ci-del{ margin-left:auto; }

/*~ 号码与键盘 */
.dial-body{ position:relative; flex:0 0 auto; display:flex; flex-direction:column; justify-content:flex-end; min-height:0; }
#dial.kp-collapsed .keypad, #dial.kp-collapsed .actions{ display:none; }
.number-display{ text-align:center; flex:0 0 auto; height:44px; box-sizing:border-box; padding:0; margin:0; display:flex; align-items:center; justify-content:center; background:transparent; overflow:hidden; }
.num-text{ font-size:34px; font-weight:300; letter-spacing:6px; font-variant-numeric:tabular-nums; color:var(--ink-strong); }
.num-text.placeholder{ font-size:12px; font-weight:500; letter-spacing:4px; color:var(--ink-faint); }
.keypad{ display:grid; grid-template-columns:repeat(3,1fr); margin-top:0; padding:12px 6px; border-radius:26px; background:rgba(255,255,255,.42); border:1px solid rgba(255,255,255,.6); backdrop-filter:blur(20px) saturate(1.5); -webkit-backdrop-filter:blur(20px) saturate(1.5); box-shadow:0 10px 30px rgba(20,20,26,.08); }
body[data-mode="dark"] .keypad{ background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.14); box-shadow:0 10px 30px rgba(0,0,0,.42); }
.key{ height:58px; border:none; background:transparent; color:var(--ink-strong); font-size:26px; font-weight:400; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border-radius:50%; transition:background .12s,transform .1s; }
.key:active{ background:var(--p-soft); transform:scale(.94); }
.key small{ font-size:9px; color:var(--ink-soft); letter-spacing:2.5px; font-weight:500; }
.actions{ position:relative; display:flex; align-items:center; justify-content:center; margin-top:14px; height:70px; }
.actions > div{ display:none; }
.call-btn{ width:66px; height:66px; border-radius:50%; border:none; cursor:pointer; background:var(--ink-strong); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px var(--shadow-strong); transition:transform .15s; }
.call-btn:active{ transform:scale(.92); }
.call-btn svg{ fill:#fff; }
body[data-mode="dark"] .call-btn svg{ fill:#0f0f11; }
.del-btn{ position:absolute; right:8px; top:50%; transform:translateY(-50%); width:54px; height:54px; border:none; background:transparent; color:var(--ink-soft); font-size:25px; cursor:pointer; z-index:6; padding:0; }
.kp-toggle{ position:absolute; bottom:25px; left:8px; width:44px; height:44px; border-radius:14px; border:1px solid var(--border); background:var(--card); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:6; backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4); box-shadow:0 4px 14px var(--shadow); }
.kp-toggle svg{ width:20px; height:20px; }
#dial.kp-collapsed .kp-toggle{ bottom:0; }

/*~ 呼叫中 */
#calling{ justify-content:center; align-items:center; gap:22px; padding:0 24px; }
.avatar{ width:118px; height:118px; border-radius:50%; object-fit:cover; background:var(--p-soft); border:none; box-shadow:0 0 0 1px var(--border),0 18px 46px var(--shadow-deep); animation:breathe 2.6s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.03); box-shadow:0 0 0 10px var(--glow),0 22px 54px var(--shadow-deep); } }
.calling-name{ font-size:25px; font-weight:300; letter-spacing:5px; color:var(--ink-strong); }
.calling-status{ font-size:10px; letter-spacing:5px; color:var(--ink-faint); animation:blink 1.6s infinite; }
@keyframes blink{ 50%{ opacity:.25; } }
.hang-red{ width:62px; height:62px; border-radius:50%; border:none; cursor:pointer; background:var(--ink-strong); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px var(--shadow-strong); transition:transform .15s; }
.hang-red:active{ transform:scale(.92); }
.hang-red svg{ fill:#fff; transform:rotate(135deg); width:23px; height:23px; }
body[data-mode="dark"] .hang-red svg{ fill:#0f0f11; }

/*~ 通话中 */
#incall{ padding:0; }
.incall-head{ position:relative; display:grid; grid-template-columns:38px 1fr auto 34px; grid-template-areas:"av name timer mini" "av num timer mini"; align-items:center; gap:0 12px; padding:14px 20px 12px; border-bottom:1px solid var(--border); }
.incall-avatar{ grid-area:av; width:38px; height:38px; border-radius:50%; object-fit:cover; background:var(--p-soft); border:none; }
.incall-name{ grid-area:name; align-self:end; font-size:14px; font-weight:400; letter-spacing:1px; color:var(--ink-strong); }
.incall-number{ grid-area:num; align-self:start; font-size:10px; letter-spacing:2px; color:var(--ink-soft); margin-top:2px; }
.timer{ grid-area:timer; align-self:center; font-size:13px; font-weight:500; letter-spacing:1px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.mini-btn{ grid-area:mini; align-self:start; width:30px; height:30px; border:none; border-radius:50%; background:rgba(0,0,0,.055); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; padding:0; margin-top:-4px; }
.mini-btn:active{ background:rgba(0,0,0,.12); }
.ver-tag{ position:fixed; right:8px; bottom:4px; font-size:8px; color:var(--ink-faint); opacity:.45; z-index:99; pointer-events:none; }
.msg-area{ flex:1; overflow-y:auto; margin:0; padding:16px 18px 8px; display:flex; flex-direction:column; gap:8px; }
.msg{ max-width:80%; padding:10px 13px; border-radius:13px; font-size:13.5px; line-height:1.55; word-break:break-word; }
.msg.me{ align-self:flex-end; background:var(--ink-strong); color:#f6f6f8; border-bottom-right-radius:4px; }
.msg.ai{ align-self:flex-start; background:var(--card); color:var(--ink); border-bottom-left-radius:4px; border:1px solid var(--border); }
.msg .tr{ margin-top:6px; padding-top:6px; border-top:1px solid var(--border); font-size:12px; line-height:1.5; opacity:.72; }
.msg.tip{ align-self:center; background:transparent; color:var(--ink-faint); font-size:10px; letter-spacing:2px; }
body[data-mode="dark"] .msg.me{ color:#0f0f11; }
body[data-mode="dark"] .msg.ai{ background:rgba(26,26,31,.76); color:#e9e9f1; border-color:rgba(255,255,255,.22); padding:12px 14px; -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2); box-shadow:0 8px 20px rgba(0,0,0,.32); }
.input-bar{ display:flex; gap:8px; align-items:center; padding:8px 18px 0; }
.input-bar input{ flex:1; height:44px; border-radius:13px; border:1px solid var(--border); background:var(--card-input); color:var(--ink-strong); padding:0 14px; font-size:13.5px; outline:none; }
.input-bar input:focus{ border-color:var(--ink-strong); }
.mic-btn{ width:44px; height:44px; border-radius:13px; border:1px solid var(--border); background:var(--card-input); color:var(--ink-strong); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }
.mic-btn.rec{ background:var(--ink-strong); color:var(--bg1); }
.send-btn{ width:44px; height:44px; border-radius:13px; border:none; cursor:pointer; background:var(--ink-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.send-btn svg{ fill:#fff; width:18px; height:18px; }
body[data-mode="dark"] .send-btn svg{ fill:#0f0f11; }
.controls{ display:flex; gap:10px; align-items:center; justify-content:center; padding:12px 18px 22px; }
.ctrl-btn{ height:42px; padding:0 18px; border-radius:21px; border:1px solid var(--border); background:var(--card); color:var(--ink-soft); cursor:pointer; display:flex; flex-direction:row; align-items:center; gap:6px; font-size:11.5px; letter-spacing:1px; }
.ctrl-btn svg{ width:17px; height:17px; fill:currentColor; }
.ctrl-btn.on{ background:var(--ink-strong); color:var(--bg1); border-color:transparent; }
.controls .hang-red{ width:52px; height:52px; }

/*~ 设置 */
.overlay{ position:fixed; inset:0; background:var(--bg1); z-index:99; overflow-y:auto; -webkit-overflow-scrolling:touch; visibility:hidden; transform:translateX(100%); transition:transform .28s ease,visibility .28s; }
.overlay.show{ visibility:visible; transform:translateX(0); }
.sheet{ width:100%; min-height:100%; padding:22px 20px 44px; }
.sheet h3{ font-size:11px; font-weight:500; letter-spacing:7px; color:var(--ink-faint); margin-bottom:18px; }
.avatar-preview{ width:60px; height:60px; border-radius:50%; object-fit:cover; margin:0 auto 8px; display:block; background:var(--p-soft); border:1px solid var(--border); cursor:pointer; }
.row-inline .btn-album,.row-inline .btn-reset{ flex:1 1 0; height:44px; border-radius:22px; background:rgba(255,255,255,.62); color:var(--ink-soft); border:1px solid rgba(255,255,255,.85); font-size:13px; letter-spacing:2px; padding:0; cursor:pointer; -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5); box-shadow:0 6px 18px rgba(20,20,26,.07); }
body[data-mode="dark"] .row-inline .btn-album,body[data-mode="dark"] .row-inline .btn-reset{ background:rgba(255,255,255,.09); color:var(--ink-soft); border-color:rgba(255,255,255,.16); box-shadow:0 6px 18px rgba(0,0,0,.3); }
.avatar-reset{ display:block; margin:0 auto 16px; width:26px; height:26px; padding:0; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,.55); color:var(--ink-soft); font-size:13px; line-height:23px; text-align:center; cursor:pointer; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
.avatar-btns{ display:flex; gap:8px; margin-bottom:18px; }
.avatar-btns button{ flex:1; height:36px; border-radius:11px; border:1px solid var(--border); cursor:pointer; font-size:11.5px; letter-spacing:1px; background:transparent; color:var(--ink-soft); }
.btn-album{ background:var(--ink-strong); color:var(--bg1); border-color:transparent; }
.btn-reset{ background:transparent; color:var(--ink-soft); }
.field{ margin-bottom:16px; }
.field label{ font-size:9.5px; color:var(--ink-faint); display:block; margin-bottom:6px; letter-spacing:2.5px; }
.field input{ width:100%; height:46px; border-radius:12px; border:1px solid var(--border); background:var(--card-input); color:var(--ink-strong); padding:0 14px; font-size:13.5px; outline:none; transition:border .2s,background .2s; }
.field input:focus{ border-color:var(--ink-strong); background:var(--card-strong); }
.row-inline{ display:flex; gap:10px; }
.mode-btn{ flex:1; height:40px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--ink-soft); font-size:12px; letter-spacing:2px; cursor:pointer; }
.mode-btn.on{ background:var(--ink-strong); color:var(--bg1); border-color:transparent; }
.prov-row{ display:flex; gap:6px; }
.prov-btn{ flex:1; height:36px; border-radius:11px; border:1px solid var(--border); background:transparent; color:var(--ink-soft); font-size:10.5px; padding:0; cursor:pointer; }
.prov-btn.on{ background:var(--ink-strong); color:var(--bg1); border-color:transparent; }
.sheet-btns{ display:flex; gap:10px; margin-top:22px; }
.sheet-btns button{ flex:1; height:44px; border-radius:13px; border:none; cursor:pointer; font-size:13px; letter-spacing:3px; }
.btn-cancel{ background:var(--p-bg); color:var(--ink-soft); }
.btn-save{ background:var(--ink-strong); color:var(--bg1); font-weight:500; }
.slider{ display:none; }
/*~ 设置 · 玻璃面板 */
.overlay{ background-color:var(--bg1); background-image:linear-gradient(rgba(255,255,255,.46),rgba(255,255,255,.46)),var(--customBg,none); background-size:cover,cover; background-position:center,center; background-repeat:no-repeat,no-repeat; backdrop-filter:none; -webkit-backdrop-filter:none; }
body[data-mode="dark"] .overlay{ background-image:linear-gradient(rgba(12,12,15,.52),rgba(12,12,15,.52)),var(--customBg,none); }
.sheet{ width:100%; margin:0; min-height:auto; padding:22px 20px 46px; border-radius:0; background:transparent; border:none; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
.sheet h3{ color:var(--ink-soft); }
.avatar-preview{ background:rgba(255,255,255,.62); border-color:rgba(255,255,255,.85); box-shadow:0 8px 22px rgba(20,20,26,.1); }
body[data-mode="dark"] .avatar-preview{ background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.16); }
.field input{ background:rgba(255,255,255,.62); border:1px solid rgba(255,255,255,.85); backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5); box-shadow:0 6px 18px rgba(20,20,26,.07); }
.field input:focus{ background:rgba(255,255,255,.82); border-color:rgba(255,255,255,.95); }
body[data-mode="dark"] .field input{ background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.16); box-shadow:0 6px 18px rgba(0,0,0,.3); }
body[data-mode="dark"] .field input:focus{ background:rgba(255,255,255,.15); }
.avatar-btns button:not(.btn-album),.mode-btn:not(.on),.prov-btn:not(.on),.btn-cancel{ background:rgba(255,255,255,.62); border:1px solid rgba(255,255,255,.85); backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5); box-shadow:0 6px 18px rgba(20,20,26,.07); }
body[data-mode="dark"] .avatar-btns button:not(.btn-album),body[data-mode="dark"] .mode-btn:not(.on),body[data-mode="dark"] .prov-btn:not(.on),body[data-mode="dark"] .btn-cancel{ background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.16); box-shadow:0 6px 18px rgba(0,0,0,.3); }


/*~ 记录菜单 */
#callMenu{ position:fixed; z-index:120; background:var(--card-solid); border-radius:13px; box-shadow:0 12px 34px var(--shadow-deep); overflow:hidden; }
#callMenu div{ padding:12px 22px; font-size:13px; color:var(--ink-strong); cursor:pointer; }
#callMenu div:active{ background:var(--p-bg); }
#callMenu .cm-del{ border-top:1px solid var(--border); }
</style>
<script>
/* 夜铃独立版 · 宿主桥（把插件的 BellHost 接到原生 App） */
(function () {
  function safe(fn, d) {
    try { return fn(); } catch (e) { return d; }
  }
  var H = {
    log: function (m) { safe(function () { NB.log(String(m)); }); },
    dataWrite: function (o) {
      o = o || {};
      return safe(function () { return NB.dataWrite(String(o.key || ''), String(o.val || '')); }, '{"ok":false}');
    },
    dataRead: function (o) {
      o = o || {};
      return safe(function () { return NB.dataRead(String(o.key || '')); }, '{"ok":false}');
    },
    ringShow: function (o) {
      o = o || {};
      safe(function () { NB.ring(String(o.name || ''), String(o.line || ''), Number(o.timeout || 40)); });
      return '';
    },
    ringResult: function () {
      return safe(function () { return NB.ringResult(); }, '');
    },
    chatWithAgent: function (p) {
      return safe(function () { return NB.ask(JSON.stringify(p || {})); }, '{"ok":false}');
    },
    poll: function () {
      return safe(function () { return NB.pollAsk(); }, '{"ok":true,"pending":true}');
    },
    speakText: function (o) { return safe(function () { return NBT.speak(JSON.stringify(o || {})); }, '{"ok":false}'); },
    ttsPoll: function () { return safe(function () { return NBT.ttsPoll(); }, '{"ok":false}'); },
    ttsStop: function () { try { NBT.stop(); } catch (e) { } },
    ttsStream: function (o) { return safe(function () { return NBT.ttsStream(JSON.stringify(o || {})); }, '{"ok":false}'); },
    asrBegin: function () { return safe(function () { return NB.asrBegin(''); }, '{"ok":false}'); },
    asrEnd: function () { return safe(function () { return NB.asrEnd(); }, '{"ok":false}'); },
    asrCancel: function () { try { NB.asrCancel(); } catch (e) { } },
    asrAmp: function () { try { return NB.asrAmp(); } catch (e) { return 0; } },
    audioPoll: function () { return safe(function () { return NBT.poll(); }, '{"ok":false}'); },
    httpGet: function () { return '{"ok":false}'; },
    nativeProbe: function () { return ''; },
    probe: function () { return ''; },
    nativeReadBase64: function () { return ''; }
  };
  window.BellHost = H;

  /* 权限提示条：缺什么就提示，点了直接跳系统页 */
  function tip() {
    var st = {};
    try { st = JSON.parse(NB.state()); } catch (e) { st = {}; }
    var box = document.getElementById('nbPermTip');
    var need = [];
    if (!st.overlay) need.push('悬浮窗');
    if (!st.files) need.push('文件访问');
    if (!need.length) {
      if (box) box.style.display = 'none';
      return;
    }
    if (!box) {
      box = document.createElement('div');
      box.id = 'nbPermTip';
      box.style.cssText = 'position:fixed;left:14px;right:14px;top:12px;z-index:99999;padding:12px 16px;border-radius:16px;' +
        'background:rgba(20,20,26,.9);color:#f0f0f4;font-size:12.5px;letter-spacing:.4px;' +

function _b64dec(b){ try { return decodeURIComponent(escape(atob(String(b).replace(/[\r\n\s]/g,'')))); } catch(e){ return ''; } }
function storeGet(k){ if (k in _mem) return _mem[k]; try { var v = localStorage.getItem(k); if (v !== null) { _mem[k] = v; return v; } } catch(e){} try { if (window.BellHost && window.BellHost.dataRead) { var _r = window.BellHost.dataRead({ key: k }); var _o = (typeof _r === 'string') ? JSON.parse(_r) : _r; if (_o && _o.ok && _o.val) { var _d = _b64dec(_o.val); if (_d) { _mem[k] = _d; return _d; } } } } catch(e){} return null; }

  try { if (window.BellHost && window.BellHost.dataWrite) { window.BellHost.dataWrite({ key: k, val: _b64enc(v) }); } } catch(e){}
  try {

    req.onsuccess = function(e){
      var db = e.target.result;

/*~ 按键音（DTMF 双频） */
var DTMF = { '1':[697,1209], '2':[697,1336], '3':[697,1477], '4':[770,1209], '5':[770,1336], '6':[770,1477],
             '7':[852,1209], '8':[852,1336], '9':[852,1477], '*':[941,1209], '0':[941,1336], '#':[941,1477] };
function keyTone(d){
  var pair = DTMF[d];
  if (!pair) return;
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var ctx = audioCtx, t0 = ctx.currentTime;
    for (var i = 0; i < 2; i++){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = pair[i];
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.11, t0 + 0.006);
      g.gain.setValueAtTime(0.11, t0 + 0.075);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.095);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.1);
    }
  }catch(e){}
}
function addNum(d){

/* 嘟嘟声：450Hz，响0.6停0.9 */
function startRing(){
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var beep = function(){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 450;
      var t = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t+0.02);
      g.gain.setValueAtTime(0.09, t+0.55);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.6);
      var f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; o.connect(f); f.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+0.6);
    };
    beep();
    ringTimer = setInterval(beep, 1500);
  }catch(e){}
}
function stopRing(){
  clearInterval(ringTimer);
  if (audioCtx){ audioCtx.close().catch(function(){}); audioCtx = null; }
}

function connectTone(){
  try{

function extractReply(o){
  if (!o) return '';
  if (typeof o === 'string'){ try { o = JSON.parse(o); } catch(e){ return o; } }
  var depth = 0;
  var BLACK = { via:1, chatId:1, chat_id:1, timestamp:1, ts:1, id:1, role:1, roleName:1, sender:1, name:1, status:1, success:1, ok:1, title:1, __type:1, type:1 };
  function dig(x){
    if (depth > 6 || !x) return '';
    if (typeof x === 'string') return x;
    if (Array.isArray(x)){
      var firstText = '';
      for (var i = 0; i < x.length; i++){
        var m = x[i];
        if (m && typeof m === 'object'){
          var role = String(m.role || m.roleName || m.sender || '').toLowerCase();
          if (m.content !== undefined && m.content !== null){
            var r = dig(m.content);
            if (r && role === 'assistant') return r;
            if (r && !firstText) firstText = r;
          }
        }
      }
      if (firstText) return firstText;
      for (var i = 0; i < x.length; i++){ var r = dig(x[i]); if (r) return r; }
      return '';
    }
    if (typeof x === 'object'){
      var cand = ['aiResponse','messages','data','reply','answer','content','text','response'];
      for (var i = 0; i < cand.length; i++){
        if (x[cand[i]] !== undefined && x[cand[i]] !== null){
          var r = dig(x[cand[i]]);
          if (r) return r;
        }
      }
      depth++;
      for (var k in x){
        if (x.hasOwnProperty(k) && !BLACK[k]){
          var r = dig(x[k]);
          if (r && r.length > 1) { depth--; return r; }
        }
      }
      depth--;
    }
    return '';
  }
  var t = dig(o);
  return t && t.length > 1 ? t : '';
}

function bdMd5(str){
  var K = [], S = [7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
  for (var i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);
  var s = unescape(encodeURIComponent(String(str)));
  var n = s.length, words = [];
  for (i = 0; i < n; i++) words[i >> 2] = (words[i >> 2] || 0) | (s.charCodeAt(i) << ((i % 4) * 8));
  words[n >> 2] = (words[n >> 2] || 0) | (0x80 << ((n % 4) * 8));
  var bits = n * 8, total = (((n + 8) >> 6) + 1) * 16;
  for (i = 0; i < total; i++) if (words[i] === undefined) words[i] = 0;
  words[total - 2] = bits & 0xFFFFFFFF;
  words[total - 1] = Math.floor(bits / 4294967296);
  var a0 = 1732584193, a1 = -271733879, a2 = -1732584194, a3 = 271733878;
  for (i = 0; i < total; i += 16){
    var A = a0, B = a1, C = a2, D = a3;
    for (var j = 0; j < 64; j++){
      var F, g;
      if (j < 16){ F = (B & C) | (~B & D); g = j; }
      else if (j < 32){ F = (D & B) | (~D & C); g = (5 * j + 1) % 16; }
      else if (j < 48){ F = B ^ C ^ D; g = (3 * j + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * j) % 16; }
      var tmp = D; D = C; C = B;
      var sum = (A + F + K[j] + words[i + g]) | 0;
      var sh = S[(j >> 4) * 4 + (j % 4)];
      B = (B + ((sum << sh) | (sum >>> (32 - sh)))) | 0;
      A = tmp;
    }
    a0 = (a0 + A) | 0; a1 = (a1 + B) | 0; a2 = (a2 + C) | 0; a3 = (a3 + D) | 0;
  }
  function hx(v){ var r = ''; for (var k = 0; k < 4; k++){ var b = (v >>> (k * 8)) & 0xFF; r += ('0' + b.toString(16)).slice(-2); } return r; }
  return hx(a0) + hx(a1) + hx(a2) + hx(a3);
}

var _pcmRate = 24000, _nextTime = 0, _srcs = [];
function _ac(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
  }catch(e){}
  return audioCtx;
}
function stopAudio(){
  for (var i=0;i<_srcs.length;i++){ try{ _srcs[i].stop(); }catch(e){} }
  _srcs = []; _nextTime = 0;
}
function pushPcm(b64){
  if (!connected) return;
  var ctx = _ac(); if (!ctx) return;
  var bin = atob(b64), n = bin.length >> 1;
  if (!n) return;
  var f32 = new Float32Array(n);
  for (var i=0;i<n;i++){
    var lo = bin.charCodeAt(i*2), hi = bin.charCodeAt(i*2+1);
    var v = (hi << 8) | lo;
    if (v >= 32768) v -= 65536;
    f32[i] = v / 32768;
  }
  var buf = ctx.createBuffer(1, n, _pcmRate);
  buf.getChannelData(0).set(f32);
  var src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination);
  var now = ctx.currentTime;
  if (_nextTime < now + 0.02) _nextTime = now + 0.02;
  try{ src.start(_nextTime); }catch(e){}
  _nextTime += buf.duration;
  _srcs.push(src);
  speakHold((_nextTime - ctx.currentTime) * 1000);
}

function speak(text){
  try {
    var t = cfg.tts || {};
    var prov = t.provider || 'ali';
    if (prov !== 'eleven') { speakLegacy(text); return; }
    var it = (t.items && t.items[prov]) || {};
    var key = String(it.key || '').trim(), model = String(it.model || '').trim(), voice = String(it.voice || '').trim();
    if (!key || !voice) { speakLegacy(text); return; }
    if (!window.BellHost || typeof window.BellHost.ttsStream !== 'function'){ speakLegacy(text); return; }
    var host = String(TTS_BASE.eleven || 'https://api.elevenlabs.io').replace(/\/+$/, '');
    var u = host + '/v1/text-to-speech/' + encodeURIComponent(voice) + '/stream?output_format=mp3_44100_128';
    var bd = JSON.stringify({ text: String(text), model_id: model || 'eleven_v4_turbo', voice_settings: { stability: 0.5, similarity_boost: 0.75 } });
    var sr = window.BellHost.ttsStream({ url: u, key: key, body: bd, rate: 44100 });
    Promise.resolve(sr).then(function(raw){
      var o = raw;
      if (typeof o === 'string'){ try { o = JSON.parse(o); } catch(e){ o = null; } }
      if (!o || !o.ok){ mlog('ttsStream nostart ' + String((o && o.raw) || (o && o.error) || '')); speakLegacy(text); return; }
      speakHold(1000);
      var n = 0;
      var pt = setInterval(function(){
        n++;
        if (!connected || n > 240){ clearInterval(pt); speakStop(); return; }
        var pv = null, st = '', sv = '';
        try { pv = window.BellHost.ttsPoll(); } catch(e){ pv = null; }
        sv = (typeof pv === 'string') ? pv : JSON.stringify(pv || {});
        if (n <= 8) mlog('ttsPoll ' + String(sv).slice(0, 220));
        if (sv.indexOf('"state":"playing"') >= 0) st = 'playing';
        else if (sv.indexOf('"state":"done"') >= 0) st = 'done';
        else if (sv.indexOf('"state":"error"') >= 0) st = 'error';
        else if (sv.indexOf('"state":"pending"') >= 0) st = 'pending';
        if (st === 'playing'){ speakHold(700); return; }
        if (st === 'pending' && n <= 40){ speakHold(900); return; }
        clearInterval(pt);
        if (st === 'error' || st === 'pending'){
          mlog('ttsStream bail ' + String(sv).slice(0, 200));
          try { window.BellHost.ttsStop(); } catch (e9) { }
          speakLegacy(text);
          return;
        }
        speakStop();
      }, 250);
    }).catch(function(e){ mlog('ttsStream fail ' + e); speakLegacy(text); });
  } catch(e) { try { speakLegacy(text); } catch(e2){} }
}
function speakLegacy(text){

  if (!key) return;
  if (prov === 'minimax' && group && key.indexOf(':') < 0) key = key + ':' + group;
  if (prov === 'eleven' && !voice) return;
  if (prov === 'volcano' && voice && res && key.indexOf(':') < 0){ speakVolc(text); return; }
  var base = TTS_BASE[prov] || TTS_BASE.ali;
  if (!window.BellHost || typeof window.BellHost.speakText !== 'function') return;
  var pr;
  try { pr = window.BellHost.speakText({ text: text, base: base, key: key, model: model, voice: voice }); }
  catch (e){ return; }
  function playAudio(url){
    if (!connected) return;
    if (_audioEl){ try{ _audioEl.pause(); }catch(e){} }
    _audioEl = new Audio(url);
    try {
      _audioEl.onended = function(){ speakStop(); };
      _audioEl.onerror = function(){ speakStop(); };
      _audioEl.ontimeupdate = function(){ if (_speaking) speakHold(700); };
    } catch(e){}
    speakHold(1200);
    _audioEl.play().catch(function(e){
      addMsg('ai', '（语音播放失败：' + String(e && e.message ? e.message : e) + '）');
    });
  }
  Promise.resolve(pr).then(function(raw){
    var o = raw;
    if (typeof o === 'string'){ try { o = JSON.parse(o); } catch(e){ o = { raw: raw }; } }
    if (!o || o.ok !== true) return;
    if (o.dataUrl){ playAudio(o.dataUrl); return; }
    if (o.skipped || !o.pending) return;
    var tip = null;
    var n = 0;
    var pt = setInterval(function(){
      n++;
      if (n > 60){ clearInterval(pt); if (tip && tip.parentNode) tip.parentNode.removeChild(tip); return; }
      var pr2 = window.BellHost.audioPoll();
      Promise.resolve(pr2).then(function(raw2){
        var o2 = raw2;
        if (typeof o2 === 'string'){ try { o2 = JSON.parse(o2); } catch(e){ o2 = { raw: raw2 }; } }
        if (!o2) return;
        if (o2.pending || o2.dataUrl === undefined || o2.dataUrl === null) return;
        clearInterval(pt);
        if (tip && tip.parentNode) tip.parentNode.removeChild(tip);
        if (o2.ok !== true || !o2.dataUrl){
          addMsg('ai', '（语音合成失败：' + (o2.error || 'no data') + '）');
          return;
        }
        playAudio(o2.dataUrl);
      }).catch(function(){});
    }, 300);
  }).catch(function(){});
  } catch(e){}
}

/*~ TTS 配置仓 */
var TtsBox = (function () {
  var keyDraft = {};
  var sttDraft = null;

  var bdAppDraft = null, bdKeyDraft = null;
  function bdAppOf() { return bdAppDraft !== null ? bdAppDraft : (root().bdAppid || ''); }
  function bdAppSet(v) { bdAppDraft = v; }
  function bdKeyOf() { return bdKeyDraft !== null ? bdKeyDraft : (root().bdKey || ''); }
  function bdKeySet(v) { bdKeyDraft = v; }

  function empty() { return { key: '', model: '', voice: '', res: '', group: '' }; }
  function fresh() { return { provider: 'ali', items: {}, sttKey: '' }; }

  function pickByBase(base) {
    var b = String(base || '').toLowerCase();
    if (/mosi|moss/.test(b)) return 'moss';
    if (/eleven/.test(b)) return 'eleven';
    if (/openspeech|bytedance|volc/.test(b)) return 'volcano';
    if (/minimax/.test(b)) return 'minimax';
    return 'ali';
  }

  function upgrade(raw) {
    raw = raw || {};
    if (raw.items && raw.provider) return raw;
    var who0 = pickByBase(raw.ttsBase);
    var bag = {};
    bag[who0] = { key: raw.ttsKey || '', model: raw.ttsModel || '', voice: raw.voice || '', res: raw.res || '', group: raw.group || '' };
    return { provider: who0, items: bag, sttKey: raw.sttKey || '' };
  }

  function root() {
    if (!cfg.tts || !cfg.tts.items) cfg.tts = upgrade(cfg.tts || {});
    if (!cfg.tts.items) cfg.tts.items = {};
    if (!cfg.tts.provider) cfg.tts.provider = 'ali';
    return cfg.tts;
  }

  function who() { return root().provider; }

  function slot(p) {
    var r = root();
    if (!r.items[p]) r.items[p] = empty();
    return r.items[p];
  }

  function mask(k) {
    k = String(k || '');
    if (!k) return '';
    var head = k.length <= 8 ? k.slice(0, 2) : k.slice(0, 3);
    var stars = Math.max(k.length <= 8 ? 3 : 10, k.length - head.length - 2);
    var out = head;
    for (var i = 0; i < stars; i++) out += '*';
    return out + k.slice(-2);
  }

  function keyOf(p) { return keyDraft[p] !== undefined ? keyDraft[p] : (slot(p).key || ''); }
  function keySet(p, v) { keyDraft[p] = v; }
  function sttOf() { return sttDraft !== null ? sttDraft : (root().sttKey || ''); }
  function sttSet(v) { sttDraft = v; }

  function fieldsToModel(p) {
    var it = slot(p);
    if (keyDraft[p] !== undefined) it.key = String(keyDraft[p]);
    var em = $('setTtsModel'), ev = $('setTtsVoice'), er = $('setTtsRes'), eg = $('setTtsGroup');
    if (em) it.model = em.value.trim();
    if (ev) it.voice = ev.value.trim();
    if (er && p === 'volcano') it.res = er.value.trim();
    if (eg) it.group = eg.value.trim();
  }

  function paint(p) {
    var it = slot(p);
    if (keyDraft[p] === undefined) keyDraft[p] = it.key || '';
    $('setTtsKey2').value = keyDraft[p] ? mask(keyDraft[p]) : '';
    $('setTtsModel').value = it.model || '';
    $('setTtsVoice').value = it.voice || '';
    var er = $('setTtsRes');
    er.value = it.res || '';
    er.parentElement.style.display = (p === 'volcano' ? '' : 'none');
    var eg = $('setTtsGroup');
    if (eg) {
      eg.value = it.group || '';
      eg.parentElement.style.display = (p === 'minimax' ? '' : 'none');
    }
    var btns = document.querySelectorAll('#ttsProvRow .prov-btn');
    Array.prototype.forEach.call(btns, function (b) {
      b.className = 'prov-btn' + (b.getAttribute('data-p') === p ? ' on' : '');
    });
  }

  function switchTo(p) {
    fieldsToModel(who());
    root().provider = p;
    paint(p);
  }

  function resetDrafts() { keyDraft = {}; sttDraft = null; bdAppDraft = null; bdKeyDraft = null; }

  function saveAll() {
    fieldsToModel(who());
    root().sttKey = String(sttOf()).trim();
    root().bdAppid = String(bdAppOf()).trim();
    root().bdKey = String(bdKeyOf()).trim();
  }

  return { upgrade: upgrade, who: who, slot: slot, mask: mask,
           keyOf: keyOf, keySet: keySet, sttOf: sttOf, sttSet: sttSet,
           bdAppOf: bdAppOf, bdAppSet: bdAppSet, bdKeyOf: bdKeyOf, bdKeySet: bdKeySet,
           paint: paint, switchTo: switchTo, resetDrafts: resetDrafts, saveAll: saveAll };
})();

})();

/*~ 设置面板 */
var Settings = (function () {
  function ensureProfiles() {
    if (!cfg.profiles || typeof cfg.profiles !== 'object') cfg.profiles = {};
    var p = cfg.profiles;
    if (!p.main) p.main = {};
    if (!p.virtual) p.virtual = {};
    if (!cfg.active) cfg.active = 'main';
    if (!cfg.pfInit) {
      p.main = { name: cfg.name || '', number: cfg.number || '', location: cfg.location || '', cardName: cfg.cardName || '', chatId: cfg.chatId || '' };
      cfg.pfInit = 1;
    }
  }
  function activeKey() { return cfg.active === 'virtual' ? 'virtual' : 'main'; }
  function readFields() {
    var p = cfg.profiles[activeKey()];
    p.name = $('setName').value.trim();
    p.number = $('setNumber').value.trim();
    p.location = $('setLocation').value.trim();
    p.cardName = $('setCardName').value.trim();
    p.chatId = $('setChatId').value.trim();
  }
  function applyProfile() {
    var p = cfg.profiles[activeKey()];
    cfg.name = p.name || 'AI';
    var d = String(p.number || '').replace(/\D/g, '').slice(0, 11);
    cfg.number = d || '5201314';
    cfg.location = p.location || '北京';
    cfg.cardName = p.cardName || '';
    cfg.chatId = p.chatId || '';
  }
  function fillFields() {
    $('setUserName').value = cfg.userName || '';
    $('setUserLoc').value = cfg.userLoc || '';
    $('setName').value = cfg.name || '';
    $('setNumber').value = cfg.number || '';
    $('setLocation').value = cfg.location || '';
    $('setCardName').value = cfg.cardName || '';
    $('setChatId').value = cfg.chatId || '';
    paintProf();
  }
  function paintProf() {
    ['main', 'virtual'].forEach(function (k) {
      var b = $('pf-' + k);
      if (b) b.className = 'mode-btn' + (activeKey() === k ? ' on' : '');
    });
  }
  function switchProfile(k) {
    ensureProfiles();
    cfg.active = (k === 'virtual') ? 'virtual' : 'main';
    readFields();
    fillFields();
    refreshUI();
    storeSet('app_cfg', JSON.stringify(cfg));
  }
  function open() {
    Display.wipe();
    Display.paint();
    ensureProfiles();
    fillFields();
    TtsBox.resetDrafts();
    var sk = TtsBox.sttOf();
    var ba = TtsBox.bdAppOf();
    if ($('setBdAppid')) $('setBdAppid').value = ba || '';
    var bk = TtsBox.bdKeyOf();
    if ($('setBdKey')) $('setBdKey').value = bk ? TtsBox.mask(bk) : '';
    try { shSync(); } catch (e) {}

    TtsBox.paint(TtsBox.who());
    try { paintRing(); } catch (e) {}
    $('preview').src = cfg.avatar;
    $('overlay').classList.add('show');
  }
  function close() {
    $('overlay').classList.remove('show');
    Display.wipe();
    Display.paint();
  }
  function save() {
    ensureProfiles();
    cfg.userName = $('setUserName').value.trim();
    cfg.userLoc = $('setUserLoc').value.trim();
    cfg.name = $('setName').value.trim() || 'AI';
    var digits = $('setNumber').value.replace(/\D/g, '').slice(0, 11);
    cfg.number = digits || '5201314';
    cfg.location = $('setLocation').value.trim() || '北京';
    cfg.mode = Display.modeNow();
    var bgW = Display.bgWantRef();
    cfg.customBg = bgW !== null ? bgW : (cfg.customBg || '');
    cfg.cardName = $('setCardName').value.trim();
    cfg.chatId = $('setChatId').value.trim();
    TtsBox.saveAll();
    storeSet('app_cfg', JSON.stringify(cfg));
    refreshUI();
    close();
  }
  function avatarReset() {
    cfg.avatar = DEF_AVATAR;
    $('preview').src = cfg.avatar;
    storeSet('app_cfg', JSON.stringify(cfg));
    refreshUI();
  }
  function adoptAvatar(url) {
    cfg.avatar = url;
    $('preview').src = cfg.avatar;
    storeSet('app_cfg', JSON.stringify(cfg));
    refreshUI();
  }
  return { open: open, close: close, save: save, switchProfile: switchProfile,
           avatarReset: avatarReset, adoptAvatar: adoptAvatar };
})();

/* 通话记录：手动接管滑动（WebView 不认原生 overflow 滚动） */
(function(){
  function bindCallsScroll(){
    var el = document.getElementById('dialCalls');
    if (!el || el.__sb) return;
    el.__sb = true;
    var sy = 0, st = 0, on = false;
    el.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1) return;
      on = true; sy = e.touches[0].clientY; st = el.scrollTop;
    }, { passive: true });
    el.addEventListener('touchmove', function(e){
      if (!on || e.touches.length !== 1) return;
      el.scrollTop = st + (sy - e.touches[0].clientY);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    el.addEventListener('touchend', function(){ on = false; });
    el.addEventListener('touchcancel', function(){ on = false; });
  }
  bindCallsScroll();
  window.__bindCallsScroll = bindCallsScroll;
})();

function syncFromFile(){
  if (!window.BellHost || typeof window.BellHost.dataRead !== 'function') return;
  ['app_cfg','call_log'].forEach(function(k){
    try {
      var pr = window.BellHost.dataRead({ key: k });
      Promise.resolve(pr).then(function(raw){
        var o = raw;
        if (typeof o === 'string'){ try { o = JSON.parse(o); } catch(e){ o = null; } }
        if (!o || !o.ok) return;
        if (o.val){
          var txt = _b64dec(o.val);
          if (!txt) return;
          if (txt === storeGet(k)) return;
          storeSet(k, txt);
          if (k === 'app_cfg'){ try { loadCfg(); } catch(e){} }
          if (k === 'call_log'){ try { renderDialCalls(); } catch(e){} }
        } else {
          var cur = storeGet(k);
          if (cur){ try { window.BellHost.dataWrite({ key: k, val: _b64enc(cur) }); } catch(e){} }
        }
      });
    } catch(e){}
  });
}
syncFromFile();
setTimeout(function(){ checkIncoming(); }, 800);
var _lastRingTs = 0, _lastResTs = 0;
function ringPoll(){
  if (!window.BellHost || typeof window.BellHost.dataRead !== 'function' || typeof window.BellHost.ringShow !== 'function') return;
  try {
    Promise.resolve(window.BellHost.dataRead({ key: 'incoming' })).then(function(raw){
      var o = raw;
      if (typeof o === 'string'){ try { o = JSON.parse(o); } catch(e){ return; } }
      if (!o || !o.ok || !o.val) return;
      var txt = ''; try { txt = _b64dec(o.val); } catch(e){ return; }
      var d = {}; try { d = JSON.parse(txt); } catch(e){ return; }
      if (!d || !d.ts || d.ts <= _lastRingTs) return;
      if (Date.now() - d.ts > 180000) return;
      _lastRingTs = d.ts;
      try { window.BellHost.ringShow({ name: d.name || cfg.name || 'AI', line: d.line || '', timeout: 40 }); } catch(e){}
    }, function(){});
  } catch(e){}
}
function ringResultPoll(){
  if (!window.BellHost || typeof window.BellHost.ringResult !== 'function') return;
  try {
    Promise.resolve(window.BellHost.ringResult()).then(function(raw){
      var s = String(raw || '');
      if (s.indexOf('{') !== 0) return;
      var o = null; try { o = JSON.parse(s); } catch(e){ return; }
      if (!o || !o.ts || o.ts <= _lastResTs) return;
      _lastResTs = o.ts;
      if (o.act !== 'accept') return;
      try { window.BellHost.dataWrite({ key: 'incoming', val: _b64enc('{"ts":0}') }); } catch(e){}
      var l = String(o.line || incomingLine || '');
      incomingLine = '';
      try { show('calling'); } catch(e){}
      try { lift(l, true); } catch(e){}
    }, function(){});
  } catch(e){}
}
/* 原生 watch 接管轮询 */
setInterval(ringResultPoll, 1500);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { ringResultPoll(); } });
